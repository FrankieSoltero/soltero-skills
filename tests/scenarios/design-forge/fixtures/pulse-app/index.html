<!doctype html>
<html lang="en">

    <title>Pulse — uptime monitoring</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <span class="brand">Pulse</span>
      <nav><a href="#">Status</a><a href="#">Incidents</a><a href="#">Settings</a></nav>

        <li><span class="dot ok"></span> api.pulse.dev — 122 ms</li>
        <li><span class="dot ok"></span> app.pulse.dev — 98 ms</li>
        <li><span class="dot ok"></span> ingest.pulse.dev — 141 ms</li>

      </ul>
    </main>
  </body>
